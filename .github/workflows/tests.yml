name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - if: runner.os == 'Linux'
        run: python -m pip install -r requirements.lock.txt "pytest>=8,<9"
      - if: runner.os == 'Windows'
        run: python -m pip install -r requirements-windows.lock.txt "pytest>=8,<9"
      - run: python -m pip check
      - run: python -m pytest -q
